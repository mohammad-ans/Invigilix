[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-examination-office"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2", "argon2-cffi>=23,<26", "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4", "reportlab>=4,<5", "SQLAlchemy>=2,<3", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
