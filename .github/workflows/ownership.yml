name: Ownership
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted rules from the PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check the complete changed-file list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_scope.py
